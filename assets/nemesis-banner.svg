<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">NEMESISDEVX</title>
  <desc id="desc">Dark red terminal-inspired banner. Building what others won't. Less noise. More code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06080d"/>
      <stop offset="52%" stop-color="#10070c"/>
      <stop offset="100%" stop-color="#07080d"/>
    </linearGradient>
    <linearGradient id="redline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#691126" stop-opacity="0.2"/>
      <stop offset="42%" stop-color="#f53657" stop-opacity="1"/>
      <stop offset="100%" stop-color="#691126" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3f3"/>
      <stop offset="48%" stop-color="#ffdce2"/>
      <stop offset="100%" stop-color="#ff6d85"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.8">
      <stop offset="0%" stop-color="#9e1733" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#370c1b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#08070b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#84233a" stroke-opacity="0.17" stroke-width="0.7"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <path d="M 28 30 H 1172 M 28 290 H 1172" stroke="url(#redline)" stroke-width="1.3"/>
  <path d="M 28 30 V 53 M 1172 30 V 53 M 28 290 V 268 M 1172 290 V 268" stroke="#f13657" stroke-opacity="0.8" stroke-width="2"/>
  <g transform="translate(140 162)">
    <circle r="106" fill="#f5284c" opacity="0.10" filter="url(#softGlow)"/>
    <circle r="97" fill="none" stroke="#621327" stroke-width="2"/>
    <circle r="81" fill="none" stroke="#dd2748" stroke-opacity="0.85" stroke-width="2"/>
    <circle r="70" fill="#12090f" stroke="#a91e3b" stroke-opacity="0.65"/>
    <path d="M -40 38 V -38 L 37 38 V -38" fill="none" stroke="#f04463" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter" opacity="0.40" filter="url(#softGlow)"/>
    <path d="M -40 38 V -38 L 37 38 V -38" fill="none" stroke="#fff0f2" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M -101 0 H -90 M 90 0 H 101 M 0 -101 V -90 M 0 90 V 101" stroke="#f23656" stroke-width="2.5"/>
  </g>
  <g font-family="Consolas, 'Liberation Mono', monospace">
    <text x="278" y="77" font-size="17" letter-spacing="3.5" fill="#f06b7f">&gt; SYSTEM / IDENTITY // NEMESISDEVX</text>
    <text x="275" y="185" font-family="Arial, Helvetica, sans-serif" font-size="99" font-weight="900" letter-spacing="2" fill="#ef294e" opacity="0.33" filter="url(#softGlow)">NEMESIS</text>
    <text x="275" y="185" font-family="Arial, Helvetica, sans-serif" font-size="99" font-weight="900" letter-spacing="2" fill="url(#titleGradient)">NEMESIS</text>
    <rect x="278" y="204" width="590" height="2" fill="url(#redline)"/>
    <text x="280" y="237" font-size="19" letter-spacing="2" fill="#eacbd1">BUILD WHAT OTHERS WON'T.</text>
    <text x="280" y="269" font-size="15" letter-spacing="2.2" fill="#bda9b0">FLUTTER // DART // SYSTEMS // SECURITY</text>
    <g font-size="13" fill="#a87483" letter-spacing="1.2">
      <text x="1025" y="57">[ONLINE]</text>
      <text x="1045" y="269">NOISE: 0</text>
    </g>
  </g>
  <g fill="#e53252" opacity="0.7">
    <rect x="1043" y="100" width="11" height="45" rx="1"/>
    <rect x="1062" y="118" width="11" height="27" rx="1"/>
    <rect x="1081" y="90" width="11" height="55" rx="1"/>
    <rect x="1100" y="110" width="11" height="35" rx="1"/>
    <rect x="1119" y="99" width="11" height="46" rx="1"/>
    <rect x="1138" y="124" width="11" height="21" rx="1"/>
  </g>
  <path d="M 1038 170 H 1156" stroke="#ad3047" stroke-opacity="0.65" stroke-width="1"/>
  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="12" fill="#ae7081" letter-spacing="1">
    <text x="1041" y="194">TRACE / FIX</text>
    <text x="1041" y="214">TEST / SHIP</text>
  </g>
</svg>
